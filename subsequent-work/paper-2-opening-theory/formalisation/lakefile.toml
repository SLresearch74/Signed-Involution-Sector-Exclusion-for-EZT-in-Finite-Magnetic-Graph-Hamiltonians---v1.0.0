name = "M3AFormalisation"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["M3AFormalisation"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a => b` with a Unicode arrow
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "M3AFormalisation"
globs = ["M3AFormalisation", "M3A.+"]
